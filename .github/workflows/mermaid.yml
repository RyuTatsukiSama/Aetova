name: Generate Mermaid Diagrams

on:
  push:
    paths:
      - "Frontend/doc/*.mmd"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Generate png
        run: |
          docker run --rm -v ${{ github.workspace }}:/data minlag/mermaid-cli \
            -i /data/Frontend/doc/architecture.mmd \
            -o /data/Frontend/doc/architecture.png

      - name: Commit png
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Frontend/doc/*.png
          git diff --cached --quiet || git commit -m "Auto-update Mermaid diagrams"
          git push
